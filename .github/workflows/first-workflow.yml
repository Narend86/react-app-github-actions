name: "First Workflow"
on: 
  push:
  pull_request:
      branches:
        - main
        - dev
        - qa
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest

    env:
      VERCEL_ORG_ID: "${{secrets.VERCEL_ORG_ID}}"
      VERCEL_PROJECT_ID: "${{secrets.VERCEL_PROJECT_ID}}"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build React app
        run: npm run build

      - name: Upload React build artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-build
          path: dist/
          retention-days: 7

      - name: "Install vercel cli"
        run: npm install -g vercel
      - name: "Deploy to Vercel"
        run: vercel deploye dist --prod --yes --token="${{secrets.VERCEL_TOKEN}}"     

  

   
