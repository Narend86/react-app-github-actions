name: "First Workflow"
on: 
  push:
  pull_request:
      branches:
        - main
        - dev
        - qa
jobs:
   first-job:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Setup Node.js
          uses: actions/setup-node@v4  
          with:
            node-version: 24
            cache: npm
        
        - name: Install dependency
          run: npm ci

        - name: make react build
          run: npm run build